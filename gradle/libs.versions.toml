#########################
####### Versions ########
#########################
[versions]
android-minSdk = "24"
android-compileSdk = "37"
android-targetSdk = "37"
android-targetJvm = "17"

agp = "9.2.1"
googleServices = "4.5.0"
firebaseBom = "34.15.0"

### androidx common
coreKtx = "1.19.0"
appcompat = "1.7.1"
constraintlayout-ver = "2.2.1"
material = "1.14.0"
lifecycle = "2.11.0"
navigation = "2.9.8"

gson-ver = "2.14.0"
### Coil
coil-ver = "2.7.0"

##tests
junit = "4.13.2"
junitExt = "1.3.0"
espressoCore = "3.7.0"

#########################
####### Libraries #######
#########################
[libraries]
### androidx common dependencies
androidx-coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
android-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout-ver" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-navigation-runtime = { module = "androidx.navigation:navigation-runtime-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
### google gson converter
gson = { module = "com.google.code.gson:gson", version.ref = "gson-ver" }
### firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-database = { module = "com.google.firebase:firebase-database" }
### third party
#coil
coil = { module = "io.coil-kt:coil", version.ref = "coil-ver" }

# Sandbox Testing Configurations
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

#########################
######## Plugins ########
#########################
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
gms-googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }